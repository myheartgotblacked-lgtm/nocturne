
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>MOONLIGHT FOREST</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

:root {
    --night: #080b16;
    --deep: #10182a;
    --purple: #8170bd;
    --blue: #68d9d0;
    --glow: #9affeb;
    --gold: #c9b98b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Vazirmatn', sans-serif;
    background:
        radial-gradient(ellipse at 50% 35%, #192b3b 0%, transparent 42%),
        radial-gradient(ellipse at 15% 75%, #17142c 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, #102b30 0%, transparent 45%),
        #080b16;
    color: #e5e7ee;
}

/* Background atmosphere */

.sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.moon {
    position: absolute;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0%, #c9e9df 25%, #8baeb2 65%, #536d85 100%);
    box-shadow:
        0 0 35px #9affeb66,
        0 0 90px #75c9cf44,
        0 0 160px #8b78c533;
    opacity: .85;
    animation: moonGlow 5s ease-in-out infinite alternate;
}

@keyframes moonGlow {
    from { box-shadow: 0 0 35px #9affeb55, 0 0 80px #75c9cf33; }
    to { box-shadow: 0 0 55px #9affeb99, 0 0 130px #75c9cf66; }
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(2px 2px at 10% 20%, #c4fff3 90%, transparent),
        radial-gradient(1px 1px at 25% 40%, #fff 90%, transparent),
        radial-gradient(2px 2px at 80% 15%, #a6e9e3 90%, transparent),
        radial-gradient(1px 1px at 70% 55%, #fff 90%, transparent),
        radial-gradient(2px 2px at 90% 75%, #c4fff3 90%, transparent),
        radial-gradient(1px 1px at 35% 80%, #fff 90%, transparent),
        radial-gradient(2px 2px at 55% 12%, #b5a8e8 90%, transparent);
    background-size: 350px 350px;
    animation: starsMove 45s linear infinite;
    opacity: .65;
}

@keyframes starsMove {
    from { transform: translateY(0); }
    to { transform: translateY(100px); }
}

/* Main layout */

main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
    text-align: center;
}

.eyebrow {
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 8px;
    direction: ltr;
    opacity: .8;
    margin-bottom: 25px;
    text-shadow: 0 0 15px var(--blue);
}

/* CSS-only magical tree */

.tree-stage {
    position: relative;
    width: min(440px, 90vw);
    height: 390px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}

.tree-aura {
    position: absolute;
    width: 290px;
    height: 290px;
    border-radius: 50%;
    background: radial-gradient(circle, #64e7d02b 0%, #5d8fc01b 40%, transparent 72%);
    filter: blur(15px);
    animation: aura 5s ease-in-out infinite alternate;
}

@keyframes aura {
    from { transform: scale(.85); opacity: .6; }
    to { transform: scale(1.2); opacity: 1; }
}

.tree {
    position: relative;
    width: 300px;
    height: 330px;
    filter: drop-shadow(0 0 15px #75e9d077);
}

.trunk {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 25px;
    height: 190px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #263d42, #a1d9c3, #315c5a);
    border-radius: 50% 50% 12% 12%;
    box-shadow: 0 0 25px #7df3d066;
    clip-path: polygon(35% 0, 65% 0, 72% 20%, 100% 100%, 0 100%, 28% 20%);
}

.branch {
    position: absolute;
    bottom: 145px;
    left: 50%;
    width: 13px;
    height: 155px;
    transform-origin: bottom center;
    border-radius: 100% 0;
    background: linear-gradient(90deg, #315b59, #a0d8c4, #315b59);
    box-shadow: 0 0 14px #77e8d866;
}

.b1 { transform: translateX(-50%) rotate(-48deg); height: 165px; }
.b2 { transform: translateX(-50%) rotate(48deg); height: 165px; }
.b3 { transform: translateX(-50%) rotate(-25deg); height: 125px; }
.b4 { transform: translateX(-50%) rotate(25deg); height: 125px; }
.b5 { transform: translateX(-50%) rotate(-8deg); height: 205px; width: 10px; }
.b6 { transform: translateX(-50%) rotate(75deg); height: 105px; width: 9px; }
.b7 { transform: translateX(-50%) rotate(-75deg); height: 105px; width: 9px; }

.leaves {
    position: absolute;
    inset: 0;
}

.leaf {
    position: absolute;
    width: 52px;
    height: 25px;
    border-radius: 100% 0 100% 0;
    background: linear-gradient(135deg, #a6f5dc, #55b7a5 60%, #386d7a);
    box-shadow: 0 0 18px #70f5d477;
    opacity: .9;
    animation: leafPulse 4s ease-in-out infinite alternate;
}

.leaf:nth-child(1) { top: 50px; left: 75px; transform: rotate(25deg); }
.leaf:nth-child(2) { top: 25px; left: 145px; transform: rotate(80deg); }
.leaf:nth-child(3) { top: 65px; right: 65px; transform: rotate(150deg); }
.leaf:nth-child(4) { top: 115px; left: 35px; transform: rotate(5deg); }
.leaf:nth-child(5) { top: 110px; right: 30px; transform: rotate(175deg); }
.leaf:nth-child(6) { top: 155px; left: 90px; transform: rotate(45deg); }
.leaf:nth-child(7) { top: 155px; right: 85px; transform: rotate(145deg); }
.leaf:nth-child(8) { top: 5px; left: 105px; transform: rotate(40deg) scale(.7); }
.leaf:nth-child(9) { top: 10px; right: 105px; transform: rotate(140deg) scale(.7); }

@keyframes leafPulse {
    from { filter: brightness(.75); opacity: .7; }
    to { filter: brightness(1.5); opacity: 1; }
}

/* Roots */

.roots {
    position: absolute;
    bottom: -3px;
    left: 50%;
    width: 180px;
    height: 35px;
    transform: translateX(-50%);
    border-bottom: 3px solid #8dd9c0;
    border-radius: 50%;
    filter: drop-shadow(0 0 9px #79e9d0);
}

.roots::before,
.roots::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 80px;
    height: 20px;
    border-bottom: 3px solid #8dd9c0;
}

.roots::before {
    left: 0;
    transform: rotate(15deg);
}

.roots::after {
    right: 0;
    transform: rotate(-15deg);
}

/* Quote */

.quote-frame {
    position: relative;
    max-width: 850px;
    padding: 35px 45px;
    margin-top: 10px;
    border-top: 1px solid #8bdcc655;
    border-bottom: 1px solid #8bdcc655;
}

.quote-frame::before,
.quote-frame::after {
    content: "✧";
    position: absolute;
    color: var(--blue);
    font-size: 23px;
    text-shadow: 0 0 15px var(--blue);
}

.quote-frame::before {
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
}

.quote-frame::after {
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
}

.quote {
    font-size: clamp(18px, 3vw, 27px);
    font-weight: 400;
    line-height: 2.2;
    color: #e0f6ed;
    text-shadow:
        0 0 12px #8cebd777,
        0 0 30px #65cfc755;
}

.bottom-symbol {
    margin-top: 40px;
    color: #a8a0d3;
    font-size: 18px;
    letter-spacing: 12px;
    direction: ltr;
    text-shadow: 0 0 15px #9584d9;
    opacity: .8;
}

/* Floating magical particles */

.particle {
    position: fixed;
    bottom: -20px;
    width: 4px;
    height: 4px;
    background: #a0ffe6;
    border-radius: 50%;
    box-shadow: 0 0 12px 3px #73f5d966;
    pointer-events: none;
    animation: floatUp linear infinite;
    z-index: 1;
}

.particle:nth-child(1) { left: 8%; animation-duration: 13s; }
.particle:nth-child(2) { left: 19%; animation-duration: 17s; animation-delay: 2s; }
.particle:nth-child(3) { left: 31%; animation-duration: 15s; animation-delay: 4s; }
.particle:nth-child(4) { left: 45%; animation-duration: 18s; animation-delay: 1s; }
.particle:nth-child(5) { left: 58%; animation-duration: 14s; animation-delay: 5s; }
.particle:nth-child(6) { left: 71%; animation-duration: 16s; animation-delay: 3s; }
.particle:nth-child(7) { left: 84%; animation-duration: 19s; animation-delay: 6s; }
.particle:nth-child(8) { left: 94%; animation-duration: 12s; animation-delay: 2s; }

@keyframes floatUp {
    0% { transform: translateY(0) scale(.5); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: .7; }
    100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
}

/* Forest silhouettes */

.forest {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 130px;
    pointer-events: none;
    opacity: .7;
    background:
        linear-gradient(135deg, transparent 50%, #101b27 50%) 0 0 / 55px 130px repeat-x,
        linear-gradient(225deg, transparent 50%, #101b27 50%) 0 0 / 55px 130px repeat-x;
    mask-image: linear-gradient(to top, black, transparent);
    z-index: 1;
}

@media (max-width: 600px) {
    .tree-stage {
        transform: scale(.85);
        margin: -10px 0;
    }

    .quote-frame {
        padding: 25px 15px;
    }

    .quote {
        font-size: 19px;
    }

    .moon {
        width: 90px;
        height: 90px;
    }
}
</style>
</head>

<body>

<div class="sky">
    <div class="moon"></div>
    <div class="stars"></div>
</div>

<div class="forest"></div>

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<main>

    <div class="eyebrow">✧ MOONLIGHT FOREST ✧</div>

    <div class="tree-stage">
        <div class="tree-aura"></div>

        <div class="tree">

            <div class="branch b1"></div>
            <div class="branch b2"></div>
            <div class="branch b3"></div>
            <div class="branch b4"></div>
            <div class="branch b5"></div>
            <div class="branch b6"></div>
            <div class="branch b7"></div>

            <div class="leaves">
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
            </div>

            <div class="trunk"></div>
            <div class="roots"></div>

        </div>
    </div>

    <div class="quote-frame">
        <p class="quote">
            میرسد روزی که دیگر تاریکی و روشنایی ضد هم نباشند
        </p>
    </div>

    <div class="bottom-symbol">✧ ❋ ✧</div>

</main>

</body>
</html>
